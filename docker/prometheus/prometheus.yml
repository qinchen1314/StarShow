global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'starshow-boot-all'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8090']

  - job_name: 'starshow-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8000' # gateway
          - 'host.docker.internal:8001' # user
          - 'host.docker.internal:8002' # show
          - 'host.docker.internal:8003' # order
          - 'host.docker.internal:8004' # payment
