server:
  port: 8000

spring:
  application:
    name: starshow-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      routes:
        - id: starshow-user
          uri: ${USER_SERVICE_URI:http://127.0.0.1:8001}
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/reservations/**,/api/v1/notifications/**
        - id: starshow-show
          uri: ${SHOW_SERVICE_URI:http://127.0.0.1:8002}
          predicates:
            - Path=/api/v1/shows/**
        - id: starshow-order
          uri: ${ORDER_SERVICE_URI:http://127.0.0.1:8003}
          predicates:
            - Path=/api/v1/orders/**,/api/v1/seckill/**,/api/v1/tickets/**
        - id: starshow-payment
          uri: ${PAYMENT_SERVICE_URI:http://127.0.0.1:8004}
          predicates:
            - Path=/api/v1/payments/**,/api/v1/refunds/**,/api/v1/reconciliation/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

starshow:
  security:
    # 严禁回退公开默认值，必须通过环境变量注入
    jwt-secret: ${STARSHOW_JWT_SECRET:}
    jwt-expire-seconds: ${STARSHOW_JWT_EXPIRE_SECONDS:86400}
    internal-gateway-secret: ${STARSHOW_INTERNAL_GATEWAY_SECRET:}
    blacklist-timeout-ms: ${STARSHOW_BLACKLIST_TIMEOUT_MS:500}
