<!doctype html>
<html lang="zh-CN" data-type="software">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看星演票务订单、购票确认进度与付款截止时间。">
  <meta name="theme-color" content="#F8F7F3">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <title>我的订单 · 星演票务</title>
  <link rel="stylesheet" href="order-confirmation.css">
  <script type="module" src="order-confirmation.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <header class="masthead">
    <div class="wrap bar">
      <span class="brand">星演票务</span>
      <div id="account" class="account" hidden>
        <span id="account-name"></span>
        <button id="logout" type="button" class="text-action">退出登录</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main-content" tabindex="-1">
    <h1>我的订单</h1>
    <p id="notice" class="notice" role="status" hidden></p>

    <section id="sign-in" class="login-section" aria-labelledby="login-title">
      <h2 id="login-title">登录后查看订单</h2>
      <form id="login" class="fields">
        <label>手机号<input name="phone" type="tel" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <div class="actions"><button class="primary" type="submit">登录</button></div>
      </form>
    </section>

    <div id="workspace" hidden>
      <section id="order-view" class="order" aria-labelledby="order-title" hidden>
        <div id="state" aria-live="polite" aria-atomic="true">
          <h2 id="order-title" tabindex="-1">查找订单</h2>
          <p id="order-message"></p>
        </div>
        <dl id="reference" class="summary" hidden>
          <div id="number-row" hidden><dt>订单号</dt><dd id="order-number"></dd></div>
          <div><dt>演出场次</dt><dd id="scene"></dd></div>
          <div id="amount-row" class="amount-row" hidden><dt>订单金额</dt><dd id="order-amount"></dd></div>
          <div id="countdown" class="countdown" hidden>
            <dt id="deadline-label">付款剩余时间</dt>
            <dd id="remaining" role="timer" aria-labelledby="deadline-label"></dd>
          </div>
        </dl>
        <div class="actions order-actions">
          <button id="primary-action" type="button" class="primary" hidden></button>
          <button id="refresh" type="button" class="secondary" hidden>刷新进度</button>
          <button id="view-orders" type="button" class="text-action">查看我的订单</button>
        </div>
        <div id="details" class="details" hidden></div>
      </section>

      <section id="purchase" class="section" aria-labelledby="purchase-title" hidden>
        <h2 id="purchase-title">演示下单</h2>
        <p class="secondary-copy">填写当前场次的票档、数量与报价，再提交测试订单。</p>
        <form id="order-form" class="fields">
          <div class="purchase-fields">
            <label>票档 ID<input name="tierId" inputmode="numeric" pattern="[1-9][0-9]*" required></label>
            <label>购票张数<input name="qty" type="number" min="1" max="10" value="1" required></label>
            <label>单价（分）<input name="expectedUnitPriceCent" inputmode="numeric" pattern="[1-9][0-9]*" required></label>
            <label>开售版本<input name="saleConfigVersion" type="number" min="1" max="2147483647" required></label>
          </div>
          <details>
            <summary>自主选座</summary>
            <div class="purchase-fields">
              <label>分区 ID<input name="zoneId" maxlength="64"></label>
              <label>布局版本<input name="layoutVersion" maxlength="64"></label>
              <label>座位序号（逗号分隔）<input name="seatIndices"></label>
            </div>
          </details>
          <div class="actions"><button id="submit-order" class="primary" type="submit">提交购票</button></div>
        </form>
      </section>

      <section id="history" class="section" aria-labelledby="list-title">
        <div class="section-heading">
          <h2 id="list-title" tabindex="-1">订单记录</h2>
          <button type="button" id="load-orders" class="text-action">加载订单</button>
        </div>
        <div id="recent-section" class="recent" hidden>
          <h3 id="recent-title">本机续查</h3>
          <ul id="recent-requests" class="order-list" aria-labelledby="recent-title"></ul>
        </div>
        <ul id="order-list" class="order-list" aria-label="已生成订单" aria-busy="false"></ul>
        <button id="more-orders" type="button" class="text-action" hidden>加载更多</button>
      </section>

      <section id="lookup-section" class="section" aria-labelledby="lookup-title">
        <h2 id="lookup-title">按场次查找</h2>
        <p class="secondary-copy">换设备后也可以用场次 ID 找回本人的购票请求。</p>
        <form id="lookup" class="lookup-form">
          <label>场次 ID<input name="showId" inputmode="numeric" pattern="[1-9][0-9]*" required></label>
          <button type="submit" class="secondary">查找订单</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
