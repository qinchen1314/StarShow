server:
  port: 8090

spring:
  application:
    name: starshow-boot-all
  profiles:
    active: ${STARSHOW_PROFILE:monolith}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:starshow}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: pg-starshow-boot-all

starshow:
  worker-id: ${STARSHOW_WORKER_ID:1}
  seckill:
    # 动态切换抢票演进策略：V1 | V2 | V3 | V4
    strategy: ${STARSHOW_SECKILL_STRATEGY:V4}
    token-ttl-seconds: ${STARSHOW_SECKILL_TOKEN_TTL_SECONDS:60}
    request-ttl-seconds: ${STARSHOW_SECKILL_REQUEST_TTL_SECONDS:1800}
    request-lease-ms: ${STARSHOW_SECKILL_REQUEST_LEASE_MS:15000}
    poll-initial-ms: ${STARSHOW_SECKILL_POLL_INITIAL_MS:500}
    poll-max-ms: ${STARSHOW_SECKILL_POLL_MAX_MS:3000}
    poll-max-attempts: ${STARSHOW_SECKILL_POLL_MAX_ATTEMPTS:30}
    deduct-proof-ttl-seconds: ${STARSHOW_SECKILL_DEDUCT_PROOF_TTL_SECONDS:86400}
    pending-min-age-seconds: ${STARSHOW_SECKILL_PENDING_MIN_AGE_SECONDS:300}
    order-expire-minutes: ${STARSHOW_SECKILL_ORDER_EXPIRE_MINUTES:15}
    lock-wait-ms: ${STARSHOW_SECKILL_LOCK_WAIT_MS:3000}
    lock-lease-ms: ${STARSHOW_SECKILL_LOCK_LEASE_MS:10000}
    order-consumer-concurrency: ${STARSHOW_SECKILL_ORDER_CONSUMER_CONCURRENCY:4}
    per-tier-consumer-concurrency: ${STARSHOW_SECKILL_PER_TIER_CONSUMER_CONCURRENCY:1}
    mq-enabled: ${STARSHOW_SECKILL_MQ_ENABLED:true}
    timeout-dispatch-enabled: ${STARSHOW_SECKILL_TIMEOUT_DISPATCH_ENABLED:true}
    timeout-dispatch-interval-ms: ${STARSHOW_SECKILL_TIMEOUT_DISPATCH_INTERVAL_MS:10000}
    pending-reconcile-enabled: ${STARSHOW_SECKILL_PENDING_RECONCILE_ENABLED:true}
    pending-reconcile-interval-ms: ${STARSHOW_SECKILL_PENDING_RECONCILE_INTERVAL_MS:300000}
  security:
    # 所有安全密钥严禁回退仓库公开默认值，必须通过环境变量注入
    jwt-secret: ${STARSHOW_JWT_SECRET:}
    jwt-expire-seconds: ${STARSHOW_JWT_EXPIRE_SECONDS:86400}
    aes-key: ${STARSHOW_AES_KEY:}
    idcard-pepper: ${STARSHOW_IDCARD_PEPPER:}
    internal-gateway-secret: ${STARSHOW_INTERNAL_GATEWAY_SECRET:}
    blacklist-timeout-ms: ${STARSHOW_BLACKLIST_TIMEOUT_MS:500}
  reservation:
    remind-lead-seconds: ${STARSHOW_REMIND_LEAD_SECONDS:600}
    remind-max-delay-seconds: ${STARSHOW_REMIND_MAX_DELAY_SECONDS:259200}
    test-override-delay-ms: ${STARSHOW_TEST_OVERRIDE_DELAY_MS:0}
    mq-enabled: ${STARSHOW_RESERVATION_MQ_ENABLED:true}
    recovery-enabled: ${STARSHOW_REMIND_RECOVERY_ENABLED:true}
    remind-recovery-interval-ms: ${STARSHOW_REMIND_RECOVERY_INTERVAL_MS:60000}
    remind-retry-backoff-seconds: ${STARSHOW_REMIND_RETRY_BACKOFF_SECONDS:30}
    remind-recovery-batch-size: ${STARSHOW_REMIND_RECOVERY_BATCH_SIZE:100}
    remind-recovery-max-batches-per-run: ${STARSHOW_REMIND_RECOVERY_MAX_BATCHES:20}
    count-cache-ttl-seconds: ${STARSHOW_COUNT_CACHE_TTL_SECONDS:30}
    count-rebuild-lock-lease-seconds: ${STARSHOW_COUNT_REBUILD_LOCK_LEASE_SECONDS:10}
    count-local-snapshot-ttl-ms: ${STARSHOW_COUNT_LOCAL_SNAPSHOT_TTL_MS:0}
    count-max-stale-seconds: ${STARSHOW_COUNT_MAX_STALE_SECONDS:120}
    remind-dispatch-jitter-seconds: ${STARSHOW_REMIND_DISPATCH_JITTER_SECONDS:0}
  show:
    detail-l1-ttl-seconds: ${STARSHOW_SHOW_DETAIL_L1_TTL_SECONDS:60}
    detail-l1-max-size: ${STARSHOW_SHOW_DETAIL_L1_MAX_SIZE:5000}
    detail-l2-logical-ttl-seconds: ${STARSHOW_SHOW_DETAIL_L2_LOGICAL_TTL_SECONDS:300}
    detail-l2-jitter-seconds: ${STARSHOW_SHOW_DETAIL_L2_JITTER_SECONDS:300}
    detail-max-stale-seconds: ${STARSHOW_SHOW_DETAIL_MAX_STALE_SECONDS:900}
    negative-cache-ttl-seconds: ${STARSHOW_SHOW_NEGATIVE_CACHE_TTL_SECONDS:30}
    cold-read-timeout-ms: ${STARSHOW_SHOW_COLD_READ_TIMEOUT_MS:150}
    stock-local-ttl-ms: ${STARSHOW_SHOW_STOCK_LOCAL_TTL_MS:0}
    preheat-batch-size: ${STARSHOW_SHOW_PREHEAT_BATCH_SIZE:50}
    preheat-lease-seconds: ${STARSHOW_SHOW_PREHEAT_LEASE_SECONDS:30}
    task-recovery-enabled: ${STARSHOW_SHOW_TASK_RECOVERY_ENABLED:true}
    task-recovery-batch-size: ${STARSHOW_SHOW_TASK_RECOVERY_BATCH_SIZE:100}
    lifecycle-sync-enabled: ${STARSHOW_SHOW_LIFECYCLE_SYNC_ENABLED:true}
    bloom-enabled: ${STARSHOW_SHOW_BLOOM_ENABLED:true}
    max-tickets-per-order: ${STARSHOW_SHOW_MAX_TICKETS_PER_ORDER:4}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

knife4j:
  enable: true
